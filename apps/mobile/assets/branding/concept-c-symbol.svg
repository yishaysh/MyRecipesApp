    L 150 116
    C 146 120 144 126 144 130
    L 144 134
    L 112 134
    L 112 130
    C 112 126 110 120 106 116
    L 66 76
    C 60 72 56 66 56 60
    Z
  " />

  <polygon points="120,60 120,76 134,68" fill="#ffffff" />
  <circle cx="94" cy="68" r="5" fill="#f43f5e" />
  <circle cx="162" cy="68" r="5" fill="#fbbf24" />

  <!-- 3 Dots Filter Layer -->
  <circle cx="106" cy="146" r="4" fill="#a8e6cf" />
  <circle cx="128" cy="146" r="4" fill="#a8e6cf" />
  <circle cx="150" cy="146" r="4" fill="#a8e6cf" />

  <!-- Output Recipe Card -->
  <rect x="76" y="160" width="104" height="52" rx="12" fill="#ffffff" />
